  <!-- Text Label -->
  <text x="50%" y="45%" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="1">Lanka Travellers</text>
  <text x="50%" y="53%" text-anchor="middle" fill="#fef08a" font-family="system-ui, sans-serif" font-size="16" letter-spacing="2">SRI LANKA TOURISM</text>
</svg>

